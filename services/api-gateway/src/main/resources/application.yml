server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:
        # Product Service Routes
        - id: product-service
          uri: ${services.product-service.url:http://product-service:8081}
          predicates:
            - Path=/api/products/**

        # Cart Service Routes
        - id: cart-service
          uri: ${services.cart-service.url:http://cart-service:8082}
          predicates:
            - Path=/api/cart/**

        # Order Service Routes
        - id: order-service
          uri: ${services.order-service.url:http://order-service:8083}
          predicates:
            - Path=/api/orders/**

        # Inventory Service Routes
        - id: inventory-service
          uri: ${services.inventory-service.url:http://inventory-service:8084}
          predicates:
            - Path=/api/inventory/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

services:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  cart-service:
    url: ${CART_SERVICE_URL:http://localhost:8082}
  order-service:
    url: ${ORDER_SERVICE_URL:http://localhost:8083}
  inventory-service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    com.dom: DEBUG
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n"

resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
