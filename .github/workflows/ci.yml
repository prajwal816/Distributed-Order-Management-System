name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build all modules
        run: mvn clean compile -B

      - name: Run unit tests
        run: mvn test -B

      - name: Package JARs
        run: mvn package -DskipTests -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Check compilation warnings
        run: mvn clean compile -B -Xlint:all 2>&1 | tee compile-output.txt

      - name: Verify no snapshot dependencies
        run: |
          if grep -r "SNAPSHOT" pom.xml --include="pom.xml" | grep -v "1.0.0"; then
            echo "WARNING: External SNAPSHOT dependencies found"
          fi

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose
        run: docker compose config --quiet

      - name: Build Product Service image
        run: docker build -f services/product-service/Dockerfile -t dom/product-service:test .

      - name: Build Cart Service image
        run: docker build -f services/cart-service/Dockerfile -t dom/cart-service:test .

      - name: Build Order Service image
        run: docker build -f services/order-service/Dockerfile -t dom/order-service:test .

      - name: Build Inventory Service image
        run: docker build -f services/inventory-service/Dockerfile -t dom/inventory-service:test .

      - name: Build API Gateway image
        run: docker build -f services/api-gateway/Dockerfile -t dom/api-gateway:test .

      - name: Verify images created
        run: docker images | grep dom/
